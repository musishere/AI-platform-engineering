# Non-secret gateway settings, injected as env vars (the "notice board").
# Secrets (API key, DB password) live in the gateway-secrets Secret, which is
# created by hand from .env and never committed (see deployment.md 5.4).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: llm-gateway
data:
  UPSTREAM_BASE_URL: https://openrouter.ai/api
  # "redis" is the Service name: cluster DNS turns it into the Redis pod's
  # stable address, so this never needs a pod IP.
  REDIS_URL: redis://redis:6379/0
