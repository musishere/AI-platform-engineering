# The LLM gateway itself (the image built from Dockerfile).
#
# A Rollout (Argo Rollouts), not a Deployment: same pod template, but a new
# image goes out as a canary. A slice of traffic first, a smoke test, then
# the rest, with an automatic rollback if the smoke test fails. A plain
# Deployment would roll to 100% as long as /health answers, bug or not.
#
# Extra copies are safe because the gateway keeps no state in memory:
# everything lives in Postgres and Redis.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  namespace: llm-gateway
spec:
  # 4, not 2: without a traffic router, the split IS the pod count (the
  # Service picks pods at random), so 4 pods give 25% steps. 2 pods could
  # only do 50%, which isn't much of a canary.
  replicas: 4
  strategy:
    canary:
      # Rollouts points this Service at the canary pods only, so the smoke
      # test hits the NEW version, never the stable one.
      canaryService: gateway-canary
      # Never go below 4 serving pods during a rollout: an old pod leaves
      # only once its replacement is ready. The default (25%) let an old pod
      # go first, and we watched capacity drop to 3 at each step (2026-09-29).
      # Cost: each step needs one extra pod's room while it overlaps.
      maxUnavailable: 0
      maxSurge: 1
      # ponytail: split is per connection, not per request (a client that
      # keeps its connection open sticks to one version). Add an ingress
      # with weights (trafficRouting) for exact or tiny (1%) percentages.
      steps:
        - setWeight: 25   # 1 of 4 pods is the new version
        - analysis:       # smoke test (k8s/gateway-smoke.yaml); fail = abort
            templates:
              - templateName: gateway-smoke
        # Soak time: problems that don't show in one request (a slow memory
        # leak, a crash after the first minute) get a chance to appear while
        # only a quarter of traffic is exposed.
        - pause: {duration: 2m}
        - setWeight: 50
        - pause: {duration: 2m}
        # After the last step: 100%, and the old pods are removed.
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        # Refuse to start if the image ever runs as root. The Dockerfile
        # already uses UID 10001; this catches a future image that forgets to.
        runAsNonRoot: true
      # The GHCR image is private: this Secret (a read-only token, created by
      # hand per cluster, never committed) is the kubelet's login for pulling.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: gateway
          # Written by CI (.github/workflows/gateway.yml) on every merge to
          # main: one tag per commit. Don't edit by hand; merge code instead.
          image: ghcr.io/musishere/ai-platform-engineering/gateway:9c757165362d386feafab63564b183058aaf8514
          # Safe only because tags are never reused: a SHA tag always means
          # the same bytes, so a copy already on the node is the right one.
          # (With a reused tag like :latest this would run stale code.)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            # Prometheus scrapes this directly on each pod (step 2). The
            # Services below only forward 8000, so metrics (tenant ids,
            # usage) never leave the cluster through them.
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: gateway-config
          # Only the two secret keys the gateway needs, not the whole Secret
          # (it doesn't need POSTGRES_PASSWORD on its own).
          env:
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: UPSTREAM_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: DATABASE_URL
            # The pod's own name, stamped on every span it sends, so a slow
            # trace shows which pod served it (canary or stable). Kubernetes
            # fills it in at start (the "downward API").
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME)
          securityContext:
            allowPrivilegeEscalation: false
          # All probes use /health, which never touches the DB. A DB blip
          # therefore doesn't restart every gateway at once.
          # ponytail: readiness stays "ready" while Postgres is down; add a
          # DB-checking /ready for readiness once real traffic matters.
          #
          # Startup: "has it finished booting?" Liveness and readiness are
          # off until this passes once. Without it, liveness judged pods from
          # second 0 and killed 4 healthy-but-booting gateways on a busy node
          # (2026-09-29). Allows up to 30 x 2s = 60s to boot, checked every 2s
          # so a fast boot still becomes ready quickly.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          # Liveness: once running, restart a frozen process quickly (~30s).
          # timeoutSeconds 3, not the 1s default: a busy node can delay an
          # answer from a perfectly healthy process.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
# One stable address for ALL gateway pods, stable and canary alike: that's
# what makes the pod-count split work. ClusterIP = reachable only
# inside the cluster; from the Mac I use `kubectl port-forward`. On OKE this
# becomes a LoadBalancer (or Ingress) in the public LB subnet.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: llm-gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8000
---
# The canary's own address, used only by the smoke test. Rollouts adds the
# canary's pod-template hash to this selector during a rollout, so it
# matches only the new pods. Callers never use it.
apiVersion: v1
kind: Service
metadata:
  name: gateway-canary
  namespace: llm-gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8000
