# Grafana dashboard for the gateway: rate, errors, latency, TTFT, tokens and
# 429s, filterable by tenant.
#
# GENERATED JSON inside a ConfigMap. Grafana's sidecar loads every ConfigMap
# labelled grafana_dashboard: "1" (any namespace), so the dashboard lives in
# Git next to the gateway, survives a cluster rebuild, and changes by review.
# To change it: edit in the Grafana UI, "Export -> JSON", paste over the
# JSON below. Edits saved only in the UI are lost when the pod restarts.
#
# Error rate counts only 5xx: failures on our side or the provider's. 4xx
# (bad key, bad request, our own 429s) are caused by the caller or a limit,
# and paging someone for them would be noise.
#
# The bottom row is the SLO (docs/lessons/01-slos.md): availability >= 99%
# and TTFT <= 2s for 95% of streams, both over 1 day (Prometheus keeps only
# 3 days, with no disk). The SLO is stricter than the error-rate panel: the
# provider's 429s count as bad, because the tenant was refused anyway.
# `or vector(0)`: a status that hasn't happened yet has no series at all,
# and subtracting "nothing" would blank the whole panel.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-dashboard
  namespace: llm-gateway
  labels:
    grafana_dashboard: "1"
data:
  gateway.json: |
    {
      "uid": "llm-gateway",
      "title": "LLM Gateway",
      "tags": [
        "gateway"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "tenant",
            "label": "Tenant",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(gateway_requests_total, tenant)",
              "refId": "tenant"
            },
            "definition": "label_values(gateway_requests_total, tenant)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Gateway pods up",
          "description": "Pods Prometheus can scrape right now (should be 4).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{namespace=\"llm-gateway\", pod=~\"gateway-.*\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / s",
          "description": "All tenants selected above, averaged over 5 min.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(gateway_requests_total{tenant=~\"$tenant\"}[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Error rate (5xx)",
          "description": "Share of requests that failed on our side or the provider's. 4xx (bad key, bad request, our 429s) are not errors: the caller or a limit caused them.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum(rate(gateway_requests_total{tenant=~\"$tenant\", status=~\"5..\"}[5m])) / sum(rate(gateway_requests_total{tenant=~\"$tenant\"}[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "In flight",
          "description": "Requests being handled right now, all pods. Rising steadily = requests piling up.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(gateway_requests_in_flight)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request rate by tenant and status",
          "description": "Who is calling, and what they get back.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (tenant, status) (rate(gateway_requests_total{tenant=~\"$tenant\"}[5m]))",
              "legendFormat": "tenant {{tenant}} \u00b7 {{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Error rate (5xx) by tenant",
          "description": "Is one tenant hitting failures others aren't?",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum by (tenant) (rate(gateway_requests_total{tenant=~\"$tenant\", status=~\"5..\"}[5m])) / sum by (tenant) (rate(gateway_requests_total{tenant=~\"$tenant\"}[5m]))",
              "legendFormat": "tenant {{tenant}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latency (whole request, incl. full stream)",
          "description": "p50 = typical request, p95/p99 = the slow tail. Estimated from histogram buckets.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(gateway_request_duration_seconds_bucket{tenant=~\"$tenant\"}[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gateway_request_duration_seconds_bucket{tenant=~\"$tenant\"}[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(gateway_request_duration_seconds_bucket{tenant=~\"$tenant\"}[5m])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Time to first token (streams)",
          "description": "How long a user waits before words start appearing.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(gateway_time_to_first_token_seconds_bucket[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(gateway_time_to_first_token_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Tokens / min by tenant",
          "description": "From the provider's counts. Output tokens cost ~5x input for Haiku.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "60 * sum by (tenant, direction) (rate(gateway_tokens_total{tenant=~\"$tenant\"}[5m]))",
              "legendFormat": "tenant {{tenant}} \u00b7 {{direction}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Refused by our limits (429s / min)",
          "description": "rate_limit = too fast (retry in seconds); monthly_quota = out of tokens until next month.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "60 * sum by (tenant, reason) (rate(gateway_limit_rejections_total{tenant=~\"$tenant\"}[5m]))",
              "legendFormat": "tenant {{tenant}} \u00b7 {{reason}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "SLO: availability, last 1 day (target 99%)",
          "description": "Good (2xx) / calls that count. Not counted: 400, 401, 413 and our own 429s (the caller's fault, or our limits working). Everything else is bad, incl. the provider's 429/5xx and our 503s. 1-day window: Prometheus keeps 3 days, no disk. See docs/lessons/01-slos.md.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 8,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(sum(increase(gateway_requests_total{tenant=~\"$tenant\", status=~\"2..\"}[1d])) or vector(0)) / (sum(increase(gateway_requests_total{tenant=~\"$tenant\"}[1d])) - (sum(increase(gateway_requests_total{tenant=~\"$tenant\", status=~\"400|401|413\"}[1d])) or vector(0)) - (sum(increase(gateway_limit_rejections_total{tenant=~\"$tenant\"}[1d])) or vector(0)))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Error budget left, last 1 day",
          "description": "Share of the allowed 1% failures not yet used. Below 0 = SLO missed: only fixes, no risky deploys, until it recovers. Noisy at low traffic.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 28,
            "w": 8,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - (1 - ((sum(increase(gateway_requests_total{tenant=~\"$tenant\", status=~\"2..\"}[1d])) or vector(0)) / (sum(increase(gateway_requests_total{tenant=~\"$tenant\"}[1d])) - (sum(increase(gateway_requests_total{tenant=~\"$tenant\", status=~\"400|401|413\"}[1d])) or vector(0)) - (sum(increase(gateway_limit_rejections_total{tenant=~\"$tenant\"}[1d])) or vector(0))))) / (1 - 0.99)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "SLO: streams with TTFT <= 2s, last 1 day (target 95%)",
          "description": "Time to first token, not total time: total time depends on how long an answer the caller asked for. 2s is a histogram bucket edge, so this is exact. All tenants.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 28,
            "w": 8,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(gateway_time_to_first_token_seconds_bucket{le=~\"2|2.0\"}[1d])) / sum(increase(gateway_time_to_first_token_seconds_count[1d]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          }
        }
      ]
    }
